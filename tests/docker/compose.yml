# Local production-like stack: Postgres + MinIO (S3-compatible, stands in for R2) + web + worker.
services:
  postgres:
    image: postgres:16.4
    environment: { POSTGRES_USER: dear, POSTGRES_PASSWORD: dear-test-only, POSTGRES_DB: dear }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "dear"], interval: 2s, retries: 30 }
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/s3.json -ip.bind=0.0.0.0
    volumes: ["./s3.json:/etc/s3.json:ro"]
    ports: ["9000:9000", "3400:3000"]
  web:
    image: dear-web-test
    depends_on: { postgres: { condition: service_healthy } }
    env_file: stack.env
    environment: { RUN_WORKER_IN_WEB: "false", PORT: "3000" }
    network_mode: "service:s3"
  worker:
    image: dear-worker
    network_mode: "service:s3"
    depends_on: { postgres: { condition: service_healthy } }
    env_file: stack.env
